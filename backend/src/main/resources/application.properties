# ===============================================
# RESCUEBITE SPRING BOOT BACKEND CONFIGURATION
# ===============================================

spring.application.name=rescuebite-backend
server.port=8080

# -----------------------------------------------
# MySQL Database Configuration
# (Change user/password according to local MySQL)
# -----------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/rescuebite_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------
# JPA & Hibernate
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -----------------------------------------------
# JWT Security Settings
# -----------------------------------------------
# 256-bit secret key for HMAC-SHA256 signature
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# -----------------------------------------------
# CORS Configuration for React Frontend
# -----------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
